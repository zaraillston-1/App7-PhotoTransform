<head>
  <meta charset="utf-8">
  <title>Photo Transform</title>
  <meta name="viewport" content="width=device-width, initial-scale=.7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css" />
  <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>

  <script>
    window.onload = function () {
      var fileInput = document.getElementById('fileInput');
      var messageDisplayArea = document.getElementById('messageDisplayArea');

      fileInput.addEventListener('change', function (e) {
        var file = fileInput.files[0];
        var imageType = /image.*/;

        if (file.type.match(imageType)) {
          var reader = new FileReader();
          reader.onload = function (e) {
            messageDisplayArea.innerHTML = "You picked an image!";
            var img = new Image();
            img.onload = function () {
              var canvas = document.getElementById('myCanvas');
              var context = canvas.getContext("2d");

              // Clear the first canvas
              context.clearRect(0, 0, canvas.width, canvas.height);
              drawImageIOSFix(context, img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 600, 500);

              // Draw the image on the second canvas (blue intensities)
              var canvasBlue = document.getElementById('myCanvasBlue');
              var contextBlue = canvasBlue.getContext('2d');
              contextBlue.clearRect(0, 0, canvasBlue.width, canvasBlue.height);
              contextBlue.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 600, 500);

              // Modify the image data to show only blue intensities
              var imageData = contextBlue.getImageData(0, 0, 600, 500);
              var data = imageData.data;

              for (var i = 0; i < data.length; i += 4) {
                var red = data[i];    // Red value
                var green = data[i + 1];  // Green value
                var blue = data[i + 2];  // Blue value (keep as is)

                // Set red and green to 0, keep blue
                data[i] = 0;        // Red
                data[i + 1] = 0;    // Green
                data[i + 2] = blue; // Blue (retain)
              }

              contextBlue.putImageData(imageData, 0, 0);
            }
            img.src = reader.result;
          }
          reader.readAsDataURL(file);
        } else {
          messageDisplayArea.innerHTML = "File not supported!";
        }
      });
    }

    function detectVerticalSquash(img) {
      var iw = img.naturalWidth, ih = img.naturalHeight;
      var canvas = document.createElement('canvas');
      canvas.width = 1;
      canvas.height = ih;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var data = ctx.getImageData(0, 0, 1, ih).data;
      var sy = 0;
      var ey = ih;
      var py = ih;
      while (py > sy) {
        var alpha = data[(py - 1) * 4 + 3];
        if (alpha === 0) {
          ey = py;
        } else {
          sy = py;
        }
        py = (ey + sy) >> 1;
      }
      var ratio = (py / ih);
      return (ratio === 0) ? 1 : ratio;
    }

    function drawImageIOSFix(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh) {
      var vertSquashRatio = detectVerticalSquash(img);
      ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh / vertSquashRatio);
    }
  </script>
</head>

<body>
  <div data-role="page">
    <div data-role="header">
      <h1>Primary Colors</h1>
    </div><!-- /header -->

    <div data-role="content">
      <h2>Push button to take picture.</h2>
      <div>
        Press orange button to create or choose image file:
        <input type="file" id="fileInput" STYLE="background-color: #FF6600;">
      </div>
      <div id="messageDisplayArea"></div>

      <!-- First Canvas: Original Image -->
      <canvas id="myCanvas" width=600 height=500 style="border:1px solid #d3d3d3;"></canvas>

      <!-- Second Canvas: Only Blue Intensities -->
      <canvas id="myCanvasBlue" width=600 height=500 style="border:1px solid #d3d3d3;"></canvas>

      <script> 
        /* This script initiates the canvas and puts the text on the canvas "myCanvas" */
        var canvas = document.getElementById('myCanvas');
        var context = canvas.getContext("2d");
        context.font = '20pt Calibri';
        context.fillStyle = "black";
        context.fillText("Original image will go here", 10, 20);

        var canvasBlue = document.getElementById('myCanvasBlue');
        var contextBlue = canvasBlue.getContext("2d");
        contextBlue.font = '20pt Calibri';
        contextBlue.fillStyle = "black";
        contextBlue.fillText("Blue intensities will go here", 10, 20);
      </script>

    </div><!-- /content -->

    <div data-role="footer" data-position="fixed">
      <p>DIY Diagnostics</p>
    </div><!-- /footer -->
  </div><!-- /page -->
</body>

</html>
